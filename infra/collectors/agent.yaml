{
  "extensions": {
    "health_check": {
      "endpoint": "0.0.0.0:13133"
    },
    "file_storage": {
      "directory": "/var/lib/otelcol",
      "create_directory": true
    }
  },
  "receivers": {
    "otlp": {
      "protocols": {
        "grpc": {
          "endpoint": "0.0.0.0:4317"
        },
        "http": {
          "endpoint": "0.0.0.0:4318"
        }
      }
    },
    "filelog": {
      "include": [
        "/var/log/pods/sentry-otel-workshop_*/*/*.log"
      ],
      "include_file_path": true,
      "start_at": "end",
      "storage": "file_storage",
      "operators": [
        {
          "type": "container",
          "id": "container",
          "add_metadata_from_filepath": true
        },
        {
          "type": "router",
          "id": "format",
          "routes": [
            {
              "expr": "body matches \"^\\\\{\"",
              "output": "json"
            }
          ],
          "default": "plain"
        },
        {
          "type": "json_parser",
          "id": "json",
          "parse_to": "attributes"
        },
        {
          "type": "move",
          "from": "attributes.body",
          "to": "body",
          "if": "attributes.body != nil"
        },
        {
          "type": "severity_parser",
          "parse_from": "attributes.severity",
          "if": "attributes.severity != nil"
        },
        {
          "type": "add",
          "id": "sampled-flag",
          "field": "attributes.trace_flags",
          "value": "01",
          "if": "attributes.trace_flags == 1 or attributes.trace_flags == \"1\""
        },
        {
          "type": "add",
          "id": "unsampled-flag",
          "field": "attributes.trace_flags",
          "value": "00",
          "if": "attributes.trace_flags == 0 or attributes.trace_flags == \"0\" or attributes.trace_flags == nil or attributes.trace_flags == \"\""
        },
        {
          "type": "trace_parser",
          "trace_id": {
            "parse_from": "attributes.trace_id"
          },
          "span_id": {
            "parse_from": "attributes.span_id"
          },
          "trace_flags": {
            "parse_from": "attributes.trace_flags"
          },
          "if": "attributes.trace_id != nil and attributes.trace_id != \"\"",
          "output": "done"
        },
        {
          "type": "add",
          "id": "plain",
          "field": "attributes.log.source",
          "value": "container-stdout",
          "output": "done"
        },
        {
          "type": "add",
          "id": "done",
          "field": "attributes.telemetry.source",
          "value": "filelog"
        }
      ]
    }
  },
  "processors": {
    "memory_limiter": {
      "check_interval": "1s",
      "limit_mib": 192,
      "spike_limit_mib": 48
    },
    "k8sattributes": {
      "auth_type": "serviceAccount",
      "filter": {
        "namespace": "sentry-otel-workshop",
        "node_from_env_var": "NODE_NAME"
      },
      "extract": {
        "metadata": [
          "k8s.namespace.name",
          "k8s.pod.name",
          "k8s.pod.uid",
          "k8s.node.name",
          "k8s.deployment.name",
          "k8s.container.name"
        ],
        "labels": [
          {
            "tag_name": "service.name",
            "key": "app.kubernetes.io/name",
            "from": "pod"
          }
        ]
      },
      "pod_association": [
        {
          "sources": [
            {
              "from": "resource_attribute",
              "name": "k8s.pod.uid"
            }
          ]
        },
        {
          "sources": [
            {
              "from": "connection"
            }
          ]
        }
      ]
    },
    "resource": {
      "attributes": [
        {
          "key": "k8s.cluster.name",
          "value": "sentry-otel-workshop",
          "action": "upsert"
        },
        {
          "key": "deployment.environment.name",
          "value": "${env:WORKSHOP_ENVIRONMENT}",
          "action": "upsert"
        },
        {
          "key": "workshop.session_id",
          "value": "${env:WORKSHOP_SESSION_ID}",
          "action": "upsert"
        },
        {
          "key": "service.namespace",
          "value": "sentry-otel-workshop",
          "action": "insert"
        },
        {
          "key": "service.version",
          "value": "${env:SERVICE_VERSION}",
          "action": "insert"
        }
      ]
    },
    "transform/names": {
      "error_mode": "ignore",
      "trace_statements": [
        {
          "context": "resource",
          "statements": [
            "set(attributes[\"service.name\"], \"edge\") where attributes[\"service.name\"] == \"envoy\""
          ]
        }
      ],
      "log_statements": [
        {
          "context": "resource",
          "statements": [
            "set(attributes[\"service.name\"], \"edge\") where attributes[\"service.name\"] == \"envoy\""
          ]
        }
      ]
    },
    "batch": {
      "timeout": "1s",
      "send_batch_size": 256,
      "send_batch_max_size": 512
    }
  },
  "exporters": {
    "otlp/gateway": {
      "endpoint": "otel-gateway.observability.svc.cluster.local:4317",
      "tls": {
        "insecure": true
      },
      "sending_queue": {
        "enabled": true,
        "num_consumers": 2,
        "queue_size": 1000
      },
      "retry_on_failure": {
        "enabled": true,
        "initial_interval": "1s",
        "max_interval": "10s",
        "max_elapsed_time": "60s"
      }
    }
  },
  "service": {
    "extensions": [
      "health_check",
      "file_storage"
    ],
    "pipelines": {
      "traces": {
        "receivers": [
          "otlp"
        ],
        "processors": [
          "memory_limiter",
          "k8sattributes",
          "resource",
          "transform/names",
          "batch"
        ],
        "exporters": [
          "otlp/gateway"
        ]
      },
      "logs": {
        "receivers": [
          "otlp",
          "filelog"
        ],
        "processors": [
          "memory_limiter",
          "k8sattributes",
          "resource",
          "transform/names",
          "batch"
        ],
        "exporters": [
          "otlp/gateway"
        ]
      }
    }
  }
}
