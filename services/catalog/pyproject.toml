[project]
name = "workshop-catalog"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi==0.143.0", "pydantic==2.12.3", "uvicorn==0.54.0", "psycopg[binary]==3.3.6", "redis==8.1.0",
  "sentry-sdk==2.71.0",
  "opentelemetry-api==1.45.1", "opentelemetry-sdk==1.45.1", "opentelemetry-exporter-otlp-proto-http==1.45.1",
  "opentelemetry-instrumentation-fastapi==0.66b1", "opentelemetry-instrumentation-psycopg==0.66b1", "opentelemetry-instrumentation-redis==0.66b1"
]
[dependency-groups]
dev = ["pytest==8.4.2", "httpx==0.28.1", "pytest-asyncio==1.2.0"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
